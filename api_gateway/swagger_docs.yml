swagger: "2.0"
info:
  title: Microservices API
  version: "1.0.0"
  description: All available microservices in the system.

# This controls where the specs themselves are served from:
host: localhost
basePath: /
schemes:
  - http

# Vendor extension listing each service
x-servers:
  - url: http://localhost:5001
    description: User Service
  - url: http://localhost:5002
    description: Watch History Service
  - url: http://localhost:5003
    description: Rating Service
  - url: http://localhost:5004
    description: Recommendation Service
  - url: http://localhost:5005
    description: Newsfeed Service
  - url: http://localhost:5006
    description: Movie Service

paths:
  /users/:
    post:
      tags:
        - Users
      summary: Create a new user
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - username
            properties:
              username:
                type: string
                example: johndoe
      responses:
        201:
          description: User successfully created
          schema:
            type: object
            properties:
              message:
                type: string
                example: User created
              user_id:
                type: integer
                example: 1
        400:
          description: Username is missing
          schema:
            type: object
            properties:
              error:
                type: string
                example: username is required

  /users/{user_id}/friends/:
    post:
      tags:
        - Friends
      summary: Add a friend to the user
      parameters:
        - name: user_id
          in: path
          required: true
          type: integer
          description: ID of the user adding a friend
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - friend_id
            properties:
              friend_id:
                type: integer
                example: 2
      responses:
        201:
          description: Friend successfully added
          schema:
            type: object
            properties:
              message:
                type: string
                example: Friend added
        200:
          description: Users are already friends
          schema:
            type: object
            properties:
              message:
                type: string
                example: Already friends
        404:
          description: One or both users not found
          schema:
            type: object
            properties:
              error:
                type: string
                example: User or friend not found

    get:
      tags:
        - Friends
      summary: Get a user's friends
      parameters:
        - name: user_id
          in: path
          required: true
          type: integer
          description: ID of the user whose friends to retrieve
      responses:
        200:
          description: List of user's friends
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: integer
                  example: 2
                username:
                  type: string
                  example: janedoe
        404:
          description: User not found
          schema:
            type: object
            properties:
              error:
                type: string
                example: User not found

  /watch/{user_id}/{movie_id}/:
    post:
      tags:
        - Watch History
      summary: Add a movie to the user's watch history
      parameters:
        - name: user_id
          in: path
          required: true
          type: integer
          description: ID of the user
        - name: movie_id
          in: path
          required: true
          type: integer
          description: ID of the movie
      responses:
        201:
          description: Movie added to watch history
          schema:
            type: object
            properties:
              message:
                type: string
                example: Movie 1 added to user 1's history

  /watch/{user_id}/:
    get:
      tags:
        - Watch History
      summary: Get a user's watch history
      parameters:
        - name: user_id
          in: path
          required: true
          type: integer
          description: ID of the user
      responses:
        200:
          description: List of user's watch history
          schema:
            type: array
            items:
              type: object
              properties:
                movie_id:
                  type: integer
                  example: 1
                timestamp:
                  type: string
                  format: date-time
                  example: "2025-05-01T10:00:00Z"

  /rate/{user_id}/{movie_id}/:
    post:
      tags:
        - Ratings
      summary: Rate a movie
      parameters:
        - name: user_id
          in: path
          required: true
          type: integer
          description: ID of the user rating the movie
        - name: movie_id
          in: path
          required: true
          type: integer
          description: ID of the movie being rated
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - score
            properties:
              score:
                type: integer
                example: 8
                description: Rating between 1 and 10
      responses:
        201:
          description: Movie rated
          schema:
            type: object
            properties:
              message:
                type: string
                example: Rated movie 1 with score 8

  /rate/{user_id}/{movie_id}/agree:
    post:
      tags:
        - Ratings
      summary: Agree with a rating
      parameters:
        - name: user_id
          in: path
          required: true
          type: integer
          description: ID of the user agreeing
        - name: movie_id
          in: path
          required: true
          type: integer
          description: ID of the movie
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - reactor_id
            properties:
              reactor_id:
                type: integer
                example: 2
      responses:
        201:
          description: Agreed with rating
          schema:
            type: object
            properties:
              message:
                type: string
                example: Agreed with rating

  /rate/{user_id}/{movie_id}/disagree:
    post:
      tags:
        - Ratings
      summary: Disagree with a rating
      parameters:
        - name: user_id
          in: path
          required: true
          type: integer
          description: ID of the user disagreeing
        - name: movie_id
          in: path
          required: true
          type: integer
          description: ID of the movie
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - reactor_id
            properties:
              reactor_id:
                type: integer
                example: 3
      responses:
        201:
          description: Disagreed with rating
          schema:
            type: object
            properties:
              message:
                type: string
                example: Disagreed with rating

  /recommend/top/{user_id}/:
    get:
      tags:
        - Recommendations
      summary: Get top rated movies
      parameters:
        - name: user_id
          in: path
          required: true
          type: integer
          description: ID of the user requesting recommendations
      responses:
        200:
          description: List of top rated movies
          schema:
            type: array
            items:
              type: object
              properties:
                movie_id:
                  type: integer
                  example: 1
                avg_score:
                  type: number
                  format: float
                  example: 8.5

  /recommend/friends/{user_id}/:
    get:
      tags:
        - Recommendations
      summary: Recommend movies watched by friends
      parameters:
        - name: user_id
          in: path
          required: true
          type: integer
          description: ID of the user requesting recommendations
      responses:
        200:
          description: List of recommended movies
          schema:
            type: object
            properties:
              recommendations:
                type: array
                items:
                  type: integer
                  example: 1

  /newsfeed/{user_id}/:
    get:
      tags:
        - Newsfeed
      summary: Get newsfeed of recent movies watched by friends
      parameters:
        - name: user_id
          in: path
          required: true
          type: integer
          description: ID of the user requesting the newsfeed
      responses:
        200:
          description: List of recent movies watched by friends
          schema:
            type: array
            items:
              type: object
              properties:
                friend_id:
                  type: integer
                  example: 2
                friend_username:
                  type: string
                  example: janedoe
                movie_id:
                  type: integer
                  example: 1
                timestamp:
                  type: string
                  format: date-time
                  example: "2025-05-01T10:00:00Z"

  /movie/{id}/:
    get:
      tags:
        - Movies
      summary: Get movie by ID
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          description: ID of the movie
      responses:
        200:
          description: Movie details
          schema:
            type: object
            properties:
              ID:
                type: integer
                example: 1
              Movie Name:
                type: string
                example: The Shawshank Redemption
              Rating:
                type: number
                format: float
                example: 9.3
              Runtime:
                type: string
                example: "142 min"
              Genre:
                type: string
                example: Drama
              Metascore:
                type: integer
                example: 80
              Plot:
                type: string
                example: "Two imprisoned men bond over a number of years, finding solace and eventual redemption through acts of common decency."

  /movies/:
    get:
      tags:
        - Movies
      summary: Get a list of movies
      parameters:
        - name: start
          in: query
          required: false
          type: integer
          example: 0
        - name: count
          in: query
          required: false
          type: integer
          example: 50
      responses:
        200:
          description: List of movies
          schema:
            type: array
            items:
              type: object
              properties:
                ID:
                  type: integer
                  example: 1
                Movie Name:
                  type: string
                  example: The Shawshank Redemption
                Rating:
                  type: number
                  format: float
                  example: 9.3
                Runtime:
                  type: string
                  example: "142 min"
                Genre:
                  type: string
                  example: Drama
                Metascore:
                  type: integer
                  example: 80
                Plot:
                  type: string
                  example: "Two imprisoned men bond over a number of years, finding solace and eventual redemption through acts of common decency."
