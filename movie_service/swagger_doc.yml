openapi: 3.0.3
info:
  title: Movie Service API
  version: 1.0.0
  description: |
    This service provides movie information including details such as rating, genre, and plot.
    It allows fetching information about a specific movie by ID or retrieving a list of movies with pagination.

servers:
  - url: http://localhost:5006

paths:
  /movie/{id}/:
    get:
      summary: Get details of a movie by its ID
      tags:
        - Movies
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the movie to retrieve
      responses:
        '200':
          description: Movie details
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ID:
                      type: integer
                      example: 1
                    Movie Name:
                      type: string
                      example: The Shawshank Redemption
                    Rating:
                      type: number
                      format: float
                      example: 9.3
                    Runtime:
                      type: string
                      example: "142 min"
                    Genre:
                      type: string
                      example: "Drama"
                    Metascore:
                      type: integer
                      example: 80
                    Plot:
                      type: string
                      example: "Two imprisoned men bond over a number of years, finding solace and eventual redemption through acts of common decency."
        '404':
          description: Movie not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Movie not found

  /movies/:
    get:
      summary: Get a list of movies with pagination
      tags:
        - Movies
      parameters:
        - in: query
          name: start
          schema:
            type: integer
          description: The starting index of the list of movies to fetch
        - in: query
          name: count
          schema:
            type: integer
          description: The number of movies to fetch
      responses:
        '200':
          description: List of movies
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ID:
                      type: integer
                      example: 1
                    Movie Name:
                      type: string
                      example: The Shawshank Redemption
                    Rating:
                      type: number
                      format: float
                      example: 9.3
                    Runtime:
                      type: string
                      example: "142 min"
                    Genre:
                      type: string
                      example: "Drama"
                    Metascore:
                      type: integer
                      example: 80
                    Plot:
                      type: string
                      example: "Two imprisoned men bond over a number of years, finding solace and eventual redemption through acts of common decency."
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid pagination parameters
