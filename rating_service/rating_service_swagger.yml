swagger: "2.0"
info:
  title: Rating Service API
  version: "1.0.0"
  description: API for managing movie ratings and reactions
host: localhost:5003
basePath: /
schemes:
  - http

paths:
  /ratings/{user_id}/{movie_id}/:
    post:
      tags:
        - Ratings
      summary: Rate a movie
      parameters:
        - name: user_id
          in: path
          required: true
          type: integer
          description: ID of the user rating the movie
        - name: movie_id
          in: path
          required: true
          type: integer
          description: ID of the movie being rated
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - score
            properties:
              score:
                type: integer
                minimum: 1
                maximum: 10
                example: 8
                description: Rating score (1-10)
      responses:
        201:
          description: Movie rated successfully
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Rated movie 1 with score 8"
        400:
          description: Invalid input
        404:
          description: User or movie not found

  /ratings/{user_id}/{movie_id}/reaction:
    post:
      tags:
        - Reactions
      summary: Add or update a reaction to a user's rating of a movie
      parameters:
        - name: user_id
          in: path
          required: true
          type: integer
          description: ID of the user who rated the movie
        - name: movie_id
          in: path
          required: true
          type: integer
          description: ID of the movie that was rated
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - reactor_id
              - reaction-type
            properties:
              reactor_id:
                type: integer
                example: 2
                description: ID of the user reacting
              reaction-type:
                type: string
                enum: [agree, disagree]
                example: 2
                description: Reaction type (agree or disagree)

      responses:
        201:
          description: Reaction added or updated
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Agreed with rating"
        400:
          description: Invalid input or missing fields
        404:
          description: User, movie, or rating not found

  /ratings/{user_id}/:
    get:
      tags:
        - Ratings
      summary: Get a user's ratings
      parameters:
        - name: user_id
          in: path
          required: true
          type: integer
          description: ID of the user
      responses:
        200:
          description: List of ratings with reaction counts
          schema:
            type: array
            items:
              type: object
              properties:
                movie_id:
                  type: integer
                  example: 1
                score:
                  type: integer
                  example: 8
                agrees:
                  type: integer
                  example: 5
                disagrees:
                  type: integer
                  example: 2
        404:
          description: User not found

  /reactions/{reactor_id}/:
    get:
      tags:
        - Reactions
      summary: Get all reactions made by a user
      parameters:
        - name: reactor_id
          in: path
          required: true
          type: integer
          description: ID of the reacting user
      responses:
        200:
          description: List of reactions
          schema:
            type: array
            items:
              type: object
              properties:
                user_id:
                  type: integer
                  example: 3
                movie_id:
                  type: integer
                  example: 1
                reaction_type:
                  type: string
                  enum: [agree, disagree]
                  example: agree
        404:
          description: Reactor user not found
