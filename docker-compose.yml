version: '3.8'

services:
  user_db:
    image: docker.io/postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users
    volumes:
      - user_data:/var/lib/postgresql/data
    networks:
      - microservices_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  watch_db:
    image: docker.io/postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: watch
    volumes:
      - watch_data:/var/lib/postgresql/data
    networks:
      - microservices_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rating_db:
    image: docker.io/postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ratings
    volumes:
      - rating_data:/var/lib/postgresql/data
    networks:
      - microservices_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  user_service:
    build: ./user_service
    ports:
      - "5001:5001"
    networks:
      - microservices_network
    environment:
      SQLALCHEMY_DATABASE_URI: "postgresql://postgres:postgres@user_db:5432/users"
    depends_on:
      user_db:
        condition: service_healthy
    volumes:
      - ./user_service/user_service_swagger.yml:/app/user_service_swagger.yml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://user_service:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  movie_service:
    build: ./movie_service
    ports:
      - "5006:5006"
    networks:
      - microservices_network
    volumes:
      - ./movie_service/Top_10000_Movies_IMDb.csv:/app/Top_10000_Movies_IMDb.csv
      - ./movie_service/movie_service_swagger.yml:/app/movie_service_swagger.yml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://movie_service:5006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  watch_history_service:
    build: ./watch_history_service
    ports:
      - "5002:5002"
    networks:
      - microservices_network
    environment:
      SQLALCHEMY_DATABASE_URI: "postgresql://postgres:postgres@watch_db:5432/watch"
    depends_on:
      watch_db:
        condition: service_healthy
      user_service:
        condition: service_started
      movie_service:
        condition: service_started
    volumes:
      - ./watch_history_service/watch_service_swagger.yml:/app/watch_service_swagger.yml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://watch_history_service:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  rating_service:
    build: ./rating_service
    ports:
      - "5003:5003"
    networks:
      - microservices_network
    environment:
      SQLALCHEMY_DATABASE_URI: "postgresql://postgres:postgres@rating_db:5432/ratings"
    depends_on:
      rating_db:
        condition: service_healthy
      user_service:
        condition: service_started
      movie_service:
        condition: service_started
    volumes:
      - ./rating_service/rating_service_swagger.yml:/app/rating_service_swagger.yml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://rating_service:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  recommendation_service:
    build: ./recommendation_service
    ports:
      - "5004:5004"
    networks:
      - microservices_network
    depends_on:
      user_service:
        condition: service_started
      watch_history_service:
        condition: service_started
      rating_service:
        condition: service_started
    volumes:
      - ./recommendation_service/recommendation_service_swagger.yml:/app/recommendation_service_swagger.yml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://recommendation_service:5004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  newsfeed_service:
    build: ./newsfeed_service
    ports:
      - "5005:5005"
    networks:
      - microservices_network
    depends_on:
      user_service:
        condition: service_started
      watch_history_service:
        condition: service_started
    volumes:
      - ./newsfeed_service/newsfeed_service_swagger.yml:/app/newsfeed_service_swagger.yml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://newsfeed_service:5005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  microservices_network:
    driver: bridge

volumes:
  user_data:
  watch_data:
  rating_data:
