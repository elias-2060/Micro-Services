openapi: 3.0.3
info:
  title: User Service API
  version: 1.0.0
  description: |
    This service manages users and their friendships.
    It allows creation of users, adding friends, and listing a user's friends.

servers:
  - url: http://localhost:5001

paths:
  /users/:
    post:
      summary: Create a new user
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
              properties:
                username:
                  type: string
                  example: johndoe
      responses:
        '201':
          description: User successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User created
                  user_id:
                    type: integer
                    example: 1
        '400':
          description: Username is missing
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: username is required

  /users/{user_id}/friends/:
    post:
      summary: Add a friend to the user
      tags:
        - Friends
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
          description: ID of the user adding a friend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - friend_id
              properties:
                friend_id:
                  type: integer
                  example: 2
      responses:
        '201':
          description: Friend successfully added
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Friend added
        '200':
          description: Users are already friends
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Already friends
        '404':
          description: One or both users not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: User or friend not found

    get:
      summary: Get a user's friends
      tags:
        - Friends
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
          description: ID of the user whose friends to retrieve
      responses:
        '200':
          description: List of user's friends
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 2
                    username:
                      type: string
                      example: janedoe
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: User not found
