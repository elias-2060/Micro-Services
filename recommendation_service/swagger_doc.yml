openapi: 3.0.3
info:
  title: Recommendation Service API
  version: 1.0.0
  description: |
    This service provides movie recommendations for users based on:
      - Highest-rated movies across all users.
      - Movies watched by a user's friends that the user hasn't seen.

servers:
  - url: http://localhost:5004

paths:
  /recommend/top/{user_id}/:
    get:
      summary: Get top-rated movie recommendations
      tags:
        - Recommendations
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
          description: ID of the user requesting recommendations
      responses:
        '200':
          description: Top 5 movies by average rating
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    movie_id:
                      type: integer
                      example: 42
                    avg_score:
                      type: number
                      format: float
                      example: 4.6

  /recommend/friends/{user_id}/:
    get:
      summary: Recommend movies watched by user's friends
      tags:
        - Recommendations
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
          description: ID of the user requesting friend-based recommendations
      responses:
        '200':
          description: Movies friends have watched that user hasn't
          content:
            application/json:
              schema:
                type: object
                properties:
                  recommendations:
                    type: array
                    items:
                      type: integer
                    example: [15, 32, 48]
