openapi: 3.0.3
info:
  title: Watch History Service API
  version: 1.0.0
  description: |
    This service manages movie watch history for users.
    It allows adding a watched movie and retrieving a user's watch history.

servers:
  - url: http://localhost:5002

paths:
  /watch/{user_id}/{movie_id}/:
    post:
      summary: Add a movie to user's watch history
      tags:
        - Watch History
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
          description: ID of the user
        - in: path
          name: movie_id
          required: true
          schema:
            type: integer
          description: ID of the movie
      responses:
        '201':
          description: Movie successfully added to history
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Movie 5 added to user 1's history

  /watch/{user_id}/:
    get:
      summary: Get user's watch history
      tags:
        - Watch History
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
          description: ID of the user
      responses:
        '200':
          description: List of watched movies
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    movie_id:
                      type: integer
                      example: 5
                    timestamp:
                      type: string
                      format: date-time
                      example: "2025-05-04T14:48:00Z"
